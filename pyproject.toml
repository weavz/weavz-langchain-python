[project]
name = "weavz-langchain-mcp-example"
version = "0.1.0"
description = "LangChain agent connected to Weavz over MCP"
requires-python = ">=3.11,<3.14"
dependencies = ["langchain==1.5.0", "langchain-mcp-adapters==0.3.2", "langchain-openai>=1,<2", "pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.uv]
package = false
